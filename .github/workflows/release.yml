name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (ad-hoc signed)
        run: npm run tauri build -- --bundles app --ci

      - name: Create DMG with unlock helper
        run: |
          set -e
          APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            find src-tauri/target/release/bundle -name "*.app" 2>/dev/null
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH" .app)
          echo "Found app: $APP_PATH"
          
          STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$STAGING/${APP_NAME}.app"
          ln -s /Applications "$STAGING/Applications"
          
          SCRIPT_PATH="$STAGING/Unlock-${APP_NAME}.command"
          cat > "$SCRIPT_PATH" << ENDSCRIPT
          #!/bin/bash
          xattr -dr com.apple.quarantine /Applications/${APP_NAME}.app 2>/dev/null
          echo "Gatekeeper quarantine removed. You can now open ${APP_NAME} from Applications."
          open -a "${APP_NAME}" 2>/dev/null
          ENDSCRIPT
          chmod +x "$SCRIPT_PATH"
          
          mkdir -p src-tauri/target/release/bundle/dmg
          DMG_NAME="${APP_NAME}_aarch64.dmg"
          hdiutil create -srcfolder "$STAGING" -volname "$APP_NAME" -fs HFS+ -format UDZO -size 50m "src-tauri/target/release/bundle/dmg/${DMG_NAME}"
          rm -rf "$STAGING"
          echo "Created: src-tauri/target/release/bundle/dmg/${DMG_NAME}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alchemist-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body: |
            ## Installation

            1. Open the DMG
            2. Drag the app to **Applications**
            3. In the DMG, double-click **Unlock-Alchemist.command** — removes the Gatekeeper flag
            4. Open from Applications — no more warnings!

            **Why?** Ad-hoc signing (no Apple Developer account). The unlock script removes the macOS quarantine flag.

            Only install from the official [Witch Daddy Labs](https://github.com/cre8tivoz/alchemist) release.
          files: src-tauri/target/release/bundle/dmg/*.dmg
